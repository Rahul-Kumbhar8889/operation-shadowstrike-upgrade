services:
  - type: web
    name: operation-shadowstrike-server
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev --no-audit --no-fund
    # Run the same entrypoint covered by the integration tests.
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: CORS_ORIGINS
        sync: false
